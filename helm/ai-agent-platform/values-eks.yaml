# AWS EKS: namespaces come from Terraform; image repository/tag are set by the CD workflow
createNamespaces: false

sampleApp:
  image:
    repository: REPLACED_BY_CD
    tag: REPLACED_BY_CD
    pullPolicy: IfNotPresent

agent:
  image:
    repository: REPLACED_BY_CD
    tag: REPLACED_BY_CD
    pullPolicy: IfNotPresent
