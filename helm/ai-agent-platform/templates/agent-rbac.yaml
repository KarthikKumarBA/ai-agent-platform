apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aap.labels" . | nindent 4 }}
---
# Least privilege: read signals in this namespace; change ONLY the sample-app deployment
# (resourceNames), so the agent can never restart, scale or roll back itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-agent-remediator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aap.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["sample-app"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["sample-app"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-agent-remediator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aap.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: ai-agent
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: ai-agent-remediator
  apiGroup: rbac.authorization.k8s.io
