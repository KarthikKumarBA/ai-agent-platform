apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aap.labels" . | nindent 4 }}
    app: sample-app
spec:
  replicas: {{ .Values.sampleApp.replicas }}
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: sample-app
          image: "{{ .Values.sampleApp.image.repository }}:{{ .Values.sampleApp.image.tag }}"
          imagePullPolicy: {{ .Values.sampleApp.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: kubernetes
          resources:
            {{- toYaml .Values.sampleApp.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.sampleApp.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.sampleApp.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.sampleApp.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.sampleApp.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.sampleApp.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.sampleApp.probes.liveness.failureThreshold }}
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aap.labels" . | nindent 4 }}
spec:
  selector:
    app: sample-app
  ports:
    - name: http
      port: 80
      targetPort: http
