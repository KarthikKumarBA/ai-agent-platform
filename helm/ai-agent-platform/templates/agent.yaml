apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-agent-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aap.labels" . | nindent 4 }}
data:
  TARGET_NAMESPACE: {{ .Values.sampleApp.namespace | quote }}
  TARGET_DEPLOYMENT: sample-app
  TARGET_SELECTOR: app=sample-app
  {{- range $key, $value := .Values.agent.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aap.labels" . | nindent 4 }}
    app: ai-agent
spec:
  replicas: 1   # incidents are kept in memory
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ai-agent
  template:
    metadata:
      labels:
        app: ai-agent
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ toJson .Values.agent.config | sha256sum }}
    spec:
      serviceAccountName: ai-agent
      # The agent calls the Kubernetes API, so it needs its service account token
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ai-agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8090
          envFrom:
            - configMapRef:
                name: ai-agent-config
          env:
            - name: AGENT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "aap.secretName" . }}
                  key: AGENT_API_TOKEN
            {{- range $key := list "OPENAI_API_KEY" "ANTHROPIC_API_KEY" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "aap.secretName" $ }}
                  key: {{ $key }}
                  optional: true
            {{- end }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aap.labels" . | nindent 4 }}
spec:
  selector:
    app: ai-agent
  ports:
    - name: http
      port: {{ .Values.agent.service.port }}
      targetPort: http
