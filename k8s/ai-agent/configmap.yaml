apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-agent-config
  namespace: ai-agent
data:
  TARGET_NAMESPACE: sample-app
  TARGET_DEPLOYMENT: sample-app
  TARGET_SELECTOR: app=sample-app
  AGENT_DRY_RUN: "false"
  WATCH_ENABLED: "true"
  WATCH_INTERVAL_SECONDS: "10"
  UNHEALTHY_THRESHOLD_SECONDS: "30"
  INCIDENT_COOLDOWN_SECONDS: "120"
  NONE_COOLDOWN_SECONDS: "30"
  APPROVAL_TIMEOUT_SECONDS: "600"
