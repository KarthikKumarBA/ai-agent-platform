# Permissions the agent gets inside the sample-app namespace only
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-agent-remediator
  namespace: sample-app
rules:
  # Read signals
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  # Read deployments; restart (patch), rollback (update)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch", "update"]
  # Scale
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch"]
  # Revision history for rollback
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
